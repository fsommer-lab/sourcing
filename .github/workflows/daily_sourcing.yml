name: Daily Sourcing Pipeline

on:
  schedule:
    # 7:00 AM UTC, Monday–Friday  (adjust timezone offset as needed)
    - cron: "0 7 * * 1-5"
  workflow_dispatch:   # lets you trigger a manual run from the GitHub UI

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sourcing pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PITCHBOOK_API_KEY: ${{ secrets.PITCHBOOK_API_KEY }}
          GRATA_API_KEY: ${{ secrets.GRATA_API_KEY }}
          SALESFORCE_USERNAME: ${{ secrets.SALESFORCE_USERNAME }}
          SALESFORCE_PASSWORD: ${{ secrets.SALESFORCE_PASSWORD }}
          SALESFORCE_SECURITY_TOKEN: ${{ secrets.SALESFORCE_SECURITY_TOKEN }}
          SALESFORCE_DOMAIN: ${{ secrets.SALESFORCE_DOMAIN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python run.py
