name: Daily Sourcing Pipeline

on:
  schedule:
    # 7:00 AM UTC Monday–Friday (= 9:00 AM CEST / 8:00 AM CET)
    - cron: "0 7 * * 1-5"
  workflow_dispatch: # lets you trigger a manual run from the GitHub UI

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sourcing pipeline
        env:
          # Required — add these in GitHub → Settings → Secrets and variables → Actions
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Optional — add when ready
          GRATA_API_KEY: ${{ secrets.GRATA_API_KEY }}
        run: python run.py
